name: Tests
on:
    push:
        branches-ignore:
            - 'release/*'
    pull_request:
permissions:
    contents: read
jobs:
    ubuntu:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Test on Ubuntu
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Install Chromium system dependencies
              run: npx playwright install-deps chromium
            - name: Run tests
              run: npm run test
    macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Test on macOS
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm run test
    engines-floor:
        # Consumers may run the package on the engines.node floor, but development
        # tooling needs a newer Node, so build and pack with .nvmrc first.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Pack
              run: npm pack --pack-destination "$RUNNER_TEMP"
            - name: Use the engines.node floor
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.0.0 # keep in sync with engines.node in package.json
            - name: Install-smoke the packed tarball
              run: node ./scripts/install-smoke.mts "$RUNNER_TEMP"/png-visual-compare-*.tgz
    consumer-types:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            # Type-checks the packed tarball from a fresh consumer (skipLibCheck: false, no @types/pngjs).
            - name: Type-check the package as a consumer
              run: npm run test:consumer-types
