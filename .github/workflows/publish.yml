name: Publish Package
on:
    release:
        types: [published]

# id-token: write is required for npm Trusted Publishing (OIDC) and provenance.
# No NPM_TOKEN is used: the trusted publisher must be configured on npmjs.com
# (Package → Settings → Trusted Publishing) for org "dichovsky", repo
# "png-visual-compare", workflow "publish.yml", no environment.
permissions:
    contents: read
    id-token: write

concurrency:
    group: publish-${{ github.event.release.tag_name }}
    cancel-in-progress: false

jobs:
    publish:
        if: ${{ !github.event.release.prerelease }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7 # v6
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'
                  registry-url: 'https://registry.npmjs.org'
            # Only upgrade when the runner's npm is below the Trusted Publishing
            # floor. Installing npm@latest unconditionally couples this job to
            # whatever Node range the newest npm demands: npm@12 requires Node
            # ^22.22.2 || ^24.15.0 || >=26.0.0 and hard-fails EBADENGINE against
            # the Node pinned in .nvmrc, even though the preinstalled npm
            # already satisfies 11.5.1.
            - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
              run: |
                  current="$(npm --version)"
                  if [ "$(printf '%s\n%s\n' "$current" '11.5.1' | sort -V | head -n1)" = '11.5.1' ]; then
                      echo "npm $current already satisfies >= 11.5.1"
                  else
                      echo "npm $current is below 11.5.1; upgrading within the 11.x line"
                      npm install -g 'npm@^11.5.1'
                  fi
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm audit --audit-level=high
            - run: npm run build
            - name: Pre-release checks
              run: npm run release:check:pre
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
            - name: Publish to npm (Trusted Publishing / OIDC)
              run: npm publish --provenance
            - name: Post-release checks
              run: npm run release:check:post
