name: Lint workflows
on:
    push:
        branches-ignore:
            - 'release/*'
    pull_request:
permissions:
    contents: read
jobs:
    workflow-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # A pinned actionlint release, checked against the sha256 listed for the
            # linux_amd64 tarball in that release's actionlint_<version>_checksums.txt.
            # To upgrade, change both values together, taking the new hash from that asset.
            # actionlint runs the runner's preinstalled shellcheck over every `run:` script.
            - name: Install actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
                      "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
                  tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
            - name: Run actionlint on .github/workflows
              run: |
                  "$RUNNER_TEMP/actionlint" -color
